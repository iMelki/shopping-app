name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping-app-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shopping-app-frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --watchAll=false
