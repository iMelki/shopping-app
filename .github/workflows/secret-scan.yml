name: Secret scan

on:
  push:
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          # Extract only the binary, outside the checkout. The release tarball
          # also ships gitleaks' own README.md, whose example secrets used to
          # overwrite this repo's README.md and fail the working-tree scan
          # (README.md:47 sidekiq-secret, README.md:574 generic-api-key).
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history with baseline
        run: |
          gitleaks detect --verbose --redact --exit-code 1 \
            --baseline-path .gitleaks-baseline.json \
            --config .gitleaks.toml
      - name: Scan working tree
        run: |
          gitleaks detect --no-git --source . --verbose --redact --exit-code 1 \
            --baseline-path .gitleaks-baseline.json \
            --config .gitleaks.toml
